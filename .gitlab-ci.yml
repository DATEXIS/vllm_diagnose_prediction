stages:
  - build
  - test
  - docker
  - deploy

docker_build:
  stage: docker
  image: docker:26-cli
  services:
    - name: docker:26-dind
      alias: docker

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
  - echo "ApJeg.flomruf4" | docker login registry.datexis.com -u datexis --password-stdin
  script:
    - docker build -t registry.datexis.com/caka7833/vllm_diagnose_prediction:latest .
    - docker push registry.datexis.com/caka7833/vllm_diagnose_prediction:latest
    - docker build -f Dockerfile.indexer -t registry.datexis.com/caka7833/vllm_diagnose_prediction_indexer:latest .
    - docker push registry.datexis.com/caka7833/vllm_diagnose_prediction_indexer:latest