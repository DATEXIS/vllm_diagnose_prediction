apiVersion: apps/v1
kind: Deployment
metadata:
  name: merlin-ui
  namespace: yxsg9647
  labels:
    app: merlin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merlin-ui
  template:
    metadata:
      labels:
        app: merlin-ui
    spec:
      containers:
        - name: next-ui
          image: registry.datexis.com/yxsg9647/merlin_2_ui:latest
          ports:
            - containerPort: 3000
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: api-key
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
      imagePullSecrets:
        - name: private-registry-auth
---
apiVersion: v1
kind: Service
metadata:
  name: merlin-ui
  namespace: yxsg9647
spec:
  type: ClusterIP
  selector:
    app: merlin-ui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: merlin-ui-basic-auth
  namespace: yxsg9647
type: Opaque
stringData:
  auth: "chaiPeeteHueCoder:$2y$10$wYefo9VXss8LEZLj/aPltOQpDlLYMqmFTaBq2h9UtCq4D11VgszZq"
---
# Ingress: pick ONE style for your namespace.
# Restricted (default): host must be *.project.ris.bht-berlin.de, HTTP only, reachable from BHT/VPN only.
# Standard (on request): ask admins to whitelist namespace; then use a *.demo.datexis.com (etc.) host + TLS below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: merlin-ui
  namespace: yxsg9647
  annotations:
    # BHT campus + VPN client ranges (cluster ingress docs). Blocks the public internet even if DNS is reachable.
    nginx.ingress.kubernetes.io/whitelist-source-range: "141.64.0.0/16,2001:638:812::/48,10.0.0.0/8"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: merlin-ui-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "MERLIN replay - auth required"
spec:
  ingressClassName: nginx
  rules:
    - host: merlin-ui-yxsg9647.project.ris.bht-berlin.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: merlin-ui
                port:
                  number: 3000
