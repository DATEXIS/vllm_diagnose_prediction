# vLLM diagnose prediction - Experiment configuration
# Changed per experiment/run (no server rebuild required for most params).
# Cluster-wide settings (namespace, registry, wandb project, image pull
# secret) live in setup.yaml; settings hardcoded into k8s_templates.py
# do not appear here either.

# Run identification
job_name: "merlin2"
run_name: "merlin2-thinking"

log_level: "INFO"

# Inference parameters
inference:
  temperature: 0.4             # 0.6 + top_p 0.95 recommended for thinking mode; 0.2 for non-thinking
  top_p: 0.95
  max_tokens: 8192
  concurrency: 64
  guided_decoding: true

  instruction_reasoning: false  # include instruction_reasoning field in JSON schema + prompt example
  thinking: true                # adds --enable-reasoning --reasoning-parser=qwen3 to vLLM server args
  reasoning_budget: 2000

# Dataset configuration
data:
  patients_file: "data/mimic/hosp_icd10_train.pq"
  target_col: "ICD_CODES"
  admission_col: "admission_note"
  discharge_col: "discharge_note"     # used by Meta-Verifier only
  sample_size: 30

# Model configuration
model:
  name: "Qwen/Qwen3-32B"
  max_model_len: 16384
  max_num_seqs: 1024
  max_num_batched_tokens: 65536
  enable_chunked_prefill: true

# Per-experiment K8s overrides (namespace + image_pull_secrets are in setup.yaml)
k8s:
  server:
    gpu_count: 1
    gpu_type: "h200"
    memory_limit: "1024Gi"
  client:
    gpu_type: "a100"
    memory_limit: "128Gi"

# MERLIN 2 configuration -- defaults locked per MERLIN2_SPEC.md §6.
merlin2:
  enabled: true

  # --- Retrieval ---
  sim_note_threshold: 0.75
  sim_icd_threshold: 0.75
  fpr_threshold: 0.85               # reduced false prunes; codes 0.75-0.84 were often true positives
  min_support: 2                    # minimum case count before a code is eligible for code_stats
  convergence_threshold: 0.95
  max_iterations: 5                 # increased; budget_exhausted was cutting off improving cases early
  dedup_cluster_threshold: 0.90     # collapse semantic instructions with embedding cosine sim >= this;
                                    # 1.0 disables. Tune via retrieval log output.
  max_instructions_per_code: 1      # keep at most this many semantic instructions per target ICD code
                                    # (by efficacy, after cluster dedup). null disables.

  # --- Per-type instruction count caps (primary retrieval budget control) ---
  max_fp_warnings: 3                # FP gate cap per iteration; highest fpr first (was 5; 4-5 caused near-total collapse)
  max_sem_instructions: 10          # semantic cap; sweet spot ~12-13 from run analysis
  max_instructions_total: null      # optional hard ceiling across all three; null = uncapped

  # --- Under-prediction guard ---
  min_prediction_size: 3            # never halt on convergence/no-instructions if fewer codes than this

  # --- Efficacy learning ---
  update_efficacy: true             # set false on test/eval runs to freeze instruction scores
  learning_rate: 0.3
  rareness_aggregation: sqrt_mean         # how to aggregate per-code rareness into a case-level factor.
                                    # mean:      average rarity; ignores how many rare codes are present.
                                    # sum:       each rare code compounds; scales fully with code count.
                                    # sqrt_mean: mean * sqrt(n_codes); rewards multiple rare codes
                                    #            without fully scaling with total code count.
                                    # max:       dominated by the single rarest code.
                                    # geom_mean: smooth compromise between mean and max.

  # --- Instruction store ---
  instructions_path: "data/instructions.parquet"
  instructions_artifact_name: "instructions_db"
  instructions_artifact_version: "v5"

  # --- Per-code threshold-warning stats ---
  # Loop B writes new entries; Retriever synthesises FP/FN warning text at runtime.
  # Frozen-rate semantics: existing rows are never overwritten (MERLIN2_SPEC §3).
  code_stats_path: "data/code_stats.parquet"
  code_stats_artifact_name: "code_stats"
  code_stats_artifact_version: "latest"

# Meta-Verifier (Loop B) -- toggle to mint instructions after a Loop-A pass.
meta_verifier:
  enabled: false
  embedding_model: "NeuML/pubmedbert-base-embeddings"
  temperature: 0.4
  max_tokens: 4096
