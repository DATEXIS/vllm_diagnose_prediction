# vLLM diagnose prediction - Experiment configuration
# Changed per experiment/run (no server rebuild required for most params)

# Run identification
job_name: "experiment-medcpt"
run_name: "qwen8b-guided-decoding"

# Logging level
log_level: "INFO"

# Inference parameters
inference:
  temperature: 0.2
  max_tokens: 2000
  concurrency: 10
  guided_decoding: True

# Dataset configuration
data:
  patients_file: "data/mimic/patients_1411.pq"
  target_col: "ICD_CODES"
  sample_size: 1000

# Model configuration
model:
  name: "Qwen/Qwen3-8B"
  max_model_len: 16384
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  enable_chunked_prefill: true

rag:
  enabled: true
  index_persist_dir: "data/pubmed/index"
  top_k: 5

  # Classic mode (encode locally with MedCPT-Article-Encoder)
  abstracts_path: "data/pubmed/pubmed_abstracts_random_lines_250k.txt"
  max_abstracts: null

  # Pre-computed NCBI embeddings (recommended; disable classic mode above)
  precomputed_embeddings:
    enabled: true          # set to true to use NCBI pre-computed MedCPT embeddings
    download_dir: "data/pubmed/precomputed"   # where chunk files are stored on the PVC
    chunks: [34, 35, 36, 37] # chunk IDs to use (0–37, ~1M articles each, ~3 GB/chunk)
    nlist: 4096              # FAISS IVF clusters; training needs ≥ 39 × nlist vectors
    nprobes: 64              # search-time probes (higher = better recall, slower query)

  query_rewriting:
    enabled: true  # rewrite admission notes into focused medical queries before retrieval
    n_queries: 3   # >1 generates diverse query variants covering different aspects of the note
  reranking:
    enabled: true  # re-rank retrieved candidates with MedCPT-Cross-Encoder before trimming to top_k
    fetch_k: 20    # candidates to fetch per query before re-ranking (should be > top_k)

# Kubernetes cluster configuration
k8s:
  namespace: "caka7833"
  image_pull_secrets: "private-registry-auth"
  pvc_name: "vllm-data-pvc"

  server:
    gpu_count: 1
    gpu_type: "a100"
    memory_limit: "64Gi"
    memory_request: "16Gi"

  client:
    memory_limit: "16Gi"
    memory_request: "4Gi"